<!DOCTYPE html>
<!--
  index.html – KVPCinematic Portfolio
  Hosting: Netlify (statisches HTML)
  Backend: Azure App Service (Flask)
  Bilder werden sicher über Backend-Proxy geladen (kein öffentlicher Blob-Zugriff nötig)
-->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KVPCinematic Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0d0d0d;
      --surface:   #161616;
      --surface2:  #1e1e1e;
      --border:    #2a2a2a;
      --white:     #f5f5f5;
      --muted:     #888;
      --gold:      #c9a84c;
      --gold-dim:  #a8883c;
      --success:   #2d6a4f;
      --error:     #c1121f;
      --radius:    10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
    }

    /* ── APERTURE ICON (SVG inline) ── */
    .aperture-icon svg { display: block; }

    /* ── LOGIN ── */
    .login-overlay {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 60% 40%, #1a1a2e 0%, #0d0d0d 70%);
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    .login-overlay.hidden { display: none; }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 52px 44px;
      width: 100%; max-width: 400px;
      text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
    }
    .login-logo {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 8px;
    }
    .login-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px; font-weight: 700; letter-spacing: -0.3px;
    }
    .login-title .gold  { color: var(--gold); }
    .login-title .light { font-weight: 400; color: var(--muted); font-size: 20px; }
    .login-sub {
      color: var(--muted); font-size: 13px; margin-bottom: 32px; margin-top: 6px;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .login-box input {
      width: 100%; padding: 13px 16px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; margin-bottom: 12px;
      font-family: 'Inter', sans-serif; color: var(--white);
      transition: border-color 0.2s;
    }
    .login-box input::placeholder { color: var(--muted); }
    .login-box input:focus { outline: none; border-color: var(--gold); }
    .login-btn {
      width: 100%; padding: 14px;
      background: var(--gold); color: #0d0d0d;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif; letter-spacing: 0.3px;
      transition: background 0.2s;
    }
    .login-btn:hover { background: var(--gold-dim); }
    .login-error { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 40px; height: 68px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .logo {
      display: flex; align-items: center; gap: 12px;
      font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700;
    }
    .logo .kvp    { color: var(--white); }
    .logo .cinema { color: var(--gold); }
    .logo .port   { color: var(--muted); font-weight: 400; font-size: 16px; }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .badge {
      font-size: 10px; color: var(--muted); letter-spacing: 1.5px;
      text-transform: uppercase; border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 4px;
    }
    .logout-btn {
      background: transparent; color: var(--muted); border: 1px solid var(--border);
      padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 13px;
      font-family: 'Inter', sans-serif; transition: all 0.2s;
    }
    .logout-btn:hover { color: var(--white); border-color: var(--muted); }

    /* ── TOOLBAR ── */
    .toolbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 40px;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .btn {
      padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
      transition: all 0.2s; display: flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }
    .btn-primary   { background: var(--white); color: var(--bg); }
    .btn-primary:hover { background: #ddd; }
    .btn-secondary { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
    .btn-secondary:hover { color: var(--white); }
    .btn-gold      { background: var(--gold); color: #0d0d0d; font-weight: 600; }
    .btn-gold:hover { background: var(--gold-dim); }
    .btn:disabled  { opacity: 0.35; cursor: not-allowed; }
    .file-label {
      padding: 8px 16px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 6px;
      cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted);
      display: flex; align-items: center; gap: 6px; transition: all 0.2s;
    }
    .file-label:hover { color: var(--white); }
    #fileInput { display: none; }
    .toolbar-sep { width: 1px; height: 28px; background: var(--border); margin: 0 2px; }
    select {
      padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-family: 'Inter', sans-serif; font-size: 13px;
      background: var(--surface2); color: var(--white); min-width: 150px;
    }
    select option { background: var(--surface2); }
    #status {
      font-size: 12px; font-weight: 500; padding: 5px 12px;
      border-radius: 20px; display: none; margin-left: 4px;
    }
    #status.success { background: rgba(45,106,79,0.3); color: #6fcf97; display: block; }
    #status.error   { background: rgba(193,18,31,0.2); color: #ff6b6b; display: block; }
    #status.loading { background: var(--surface2); color: var(--muted); display: block; }

    /* ── STATS BAR ── */
    .stats-bar {
      padding: 9px 40px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex; gap: 24px; align-items: center; flex-wrap: wrap;
    }
    .stat { font-size: 12px; color: var(--muted); }
    .stat strong { color: var(--white); font-weight: 600; }
    #selectedCount { margin-left: auto; font-size: 12px; color: var(--gold); font-weight: 500; }

    /* ── GALLERY ── */
    .gallery-wrapper { padding: 28px 40px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    /* ── PHOTO CARD ── */
    .photo-card {
      border-radius: var(--radius); overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.25s; position: relative; cursor: pointer;
    }
    .photo-card:hover {
      transform: translateY(-3px);
      border-color: #3a3a3a;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .photo-card.selected {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
      border-color: var(--gold);
    }
    .photo-thumb-wrap {
      width: 100%; height: 210px; overflow: hidden;
      position: relative; background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
    }
    .photo-thumb-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      display: block; cursor: zoom-in;
      transition: opacity 0.3s;
    }
    .photo-thumb-wrap img.loading { opacity: 0; }
    .photo-thumb-wrap img.loaded  { opacity: 1; }
    /* Placeholder spinner while image loads */
    .img-placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .img-placeholder.hidden { display: none; }
    .mini-spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .card-checkbox {
      position: absolute; top: 10px; left: 10px;
      width: 20px; height: 20px; accent-color: var(--gold);
      cursor: pointer; z-index: 2;
    }
    .card-info { padding: 12px 14px; }
    .card-filename {
      font-size: 11px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 5px;
    }
    .card-location { font-size: 13px; font-weight: 500; color: var(--white); }
    .card-location.no-location { color: var(--muted); font-style: italic; }
    .card-device { font-size: 11px; color: var(--muted); margin-top: 3px; }

    /* ── EMPTY STATE ── */
    .empty-state {
      grid-column: 1/-1; text-align: center;
      padding: 100px 20px; color: var(--muted);
    }
    .empty-state .icon { font-size: 52px; margin-bottom: 16px; opacity: 0.5; }
    .empty-state h3 {
      font-family: 'Playfair Display', serif; font-size: 22px;
      color: var(--white); margin-bottom: 8px;
    }
    .loading-grid { grid-column: 1/-1; display: flex; justify-content: center; padding: 80px; }
    .spinner {
      width: 36px; height: 36px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── UPLOAD OVERLAY ── */
    .upload-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.8); z-index: 200;
      align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .upload-overlay.active { display: flex; }
    .upload-modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 44px 48px;
      text-align: center; min-width: 300px;
    }
    .upload-modal h3 {
      font-family: 'Playfair Display', serif; font-size: 20px;
      color: var(--white); margin-bottom: 6px;
    }
    .upload-modal p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .progress-bar {
      height: 4px; background: var(--border);
      border-radius: 2px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--gold);
      border-radius: 2px; transition: width 0.3s;
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.96); z-index: 300;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      backdrop-filter: blur(8px);
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 92vw; max-height: 80vh;
      object-fit: contain; border-radius: 4px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.8);
    }
    .lightbox-info   { color: var(--white); font-size: 14px; text-align: center; }
    .lightbox-device { color: var(--muted); font-size: 12px; }
    .lightbox-close  {
      position: absolute; top: 20px; right: 28px;
      font-size: 26px; color: var(--muted); cursor: pointer;
      background: none; border: none; transition: color 0.2s;
    }
    .lightbox-close:hover { color: var(--white); }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      header, .toolbar, .gallery-wrapper, .stats-bar { padding-left: 16px; padding-right: 16px; }
      .gallery { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .photo-thumb-wrap { height: 150px; }
    }
  </style>
</head>
<body>

<!-- ── LOGIN ── -->

  <div class="login-box">
    <div class="login-logo aperture-icon">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">

<!-- ── HEADER ── -->
<header>
  <div class="logo aperture-icon">
    <svg width="28" height="28" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="22" cy="22" r="21" stroke="#c9a84c" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="6"  fill="#c9a84c"/>
      <line x1="22" y1="1"  x2="22" y2="8"  stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="22" y1="36" x2="22" y2="43" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="1"  y1="22" x2="8"  y2="22" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="36" y1="22" x2="43" y2="22" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>

    <span><span class="kvp">KVP</span><span class="cinema">Cinematic</span> <span class="port">Portfolio</span></span>

<!-- ── TOOLBAR ── -->
<div class="toolbar">
  <label class="file-label" for="fileInput">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>

  </select>

  <button class="btn btn-gold" onclick="downloadSelected()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

  <div class="lightbox-info"   id="lightboxInfo"></div>
  <div class="lightbox-device" id="lightboxDevice"></div>
</div>

<script>
  const API = "https://app-fotogalerie-prod-f2cha4hehrgpefbt.germanywestcentral-01.azurewebsites.net";
  let authHeader = "";

  // Speichere erzeugte Blob-URLs damit wir sie später revoken können
  const blobUrls = new Map();

  function doLogin() {
    const u = document.getElementById("loginUser").value.trim();
    const p = document.getElementById("loginPass").value;
    if (!u || !p) return;
    authHeader = "Basic " + btoa(u + ":" + p);
    fetch(`${API}/api/photos`, { headers: { "Authorization": authHeader } })
      .then(r => {
        if (r.status === 401) {
          document.getElementById("loginError").style.display = "block";
          authHeader = "";
        } else {
          document.getElementById("loginOverlay").classList.add("hidden");
          document.getElementById("loginError").style.display = "none";
          init();
        }
      })
      .catch(() => {
        document.getElementById("loginError").style.display = "block";
        authHeader = "";
      });
  }

  function doLogout() {
    // Blob-URLs freigeben
    blobUrls.forEach(url => URL.revokeObjectURL(url));
    blobUrls.clear();
    authHeader = "";
    document.getElementById("loginUser").value = "";
    document.getElementById("loginPass").value = "";
    document.getElementById("loginOverlay").classList.remove("hidden");
    document.getElementById("gallery").innerHTML = '<div class="loading-grid"><div class="spinner"></div></div>';
  }

  function authFetch(url, options = {}) {
    return fetch(url, {
      ...options,
      headers: { ...options.headers, "Authorization": authHeader }
    });
  }

  async function init() {
    await Promise.all([loadLocations(), loadDevices(), loadPhotos()]);
  }

  function setStatus(msg, type = "loading") {
    const el = document.getElementById("status");
    el.textContent = msg; el.className = type;
    if (type !== "loading") setTimeout(() => { el.className = ""; el.textContent = ""; }, 4000);
  }

  async function loadLocations() {
    try {
      const locs = await (await authFetch(`${API}/api/locations`)).json();
      const sel = document.getElementById("filterLocation");
      sel.innerHTML = '<option value="">🌍 Alle Orte</option>';
      const countries = [...new Set(locs.map(l => l.country))].filter(Boolean);
      if (countries.length) {
        const g = document.createElement("optgroup"); g.label = "Nach Land";
        countries.forEach(c => {
          const o = document.createElement("option");
          o.value = `country:${c}`; o.text = `🌍 ${c}`; g.appendChild(o);
        });
        sel.appendChild(g);
      }
      const cities = locs.filter(l => l.city);
      if (cities.length) {
        const g = document.createElement("optgroup"); g.label = "Nach Stadt";
        cities.forEach(l => {
          const o = document.createElement("option");
          o.value = `city:${l.city}`; o.text = `📍 ${l.city} (${l.country})`; g.appendChild(o);
        });
        sel.appendChild(g);
      }
      document.getElementById("locationCount").textContent = locs.length;
    } catch(e) { console.error("Locations:", e); }
  }

  async function loadDevices() {
    try {
      const devs = await (await authFetch(`${API}/api/devices`)).json();
      const sel = document.getElementById("filterDevice");
      sel.innerHTML = '<option value="">📷 Alle Geräte</option>';
      devs.forEach(d => {
        const o = document.createElement("option");
        o.value = d.device; o.text = `📷 ${d.device}`; sel.appendChild(o);
      });
      document.getElementById("deviceCount").textContent = devs.length;
    } catch(e) { console.error("Devices:", e); }
  }

  async function loadPhotos(city="", country="", device="") {
    document.getElementById("gallery").innerHTML = '<div class="loading-grid"><div class="spinner"></div></div>';
    try {
      let url = `${API}/api/photos`;
      const params = [];
      if (city)    params.push(`city=${encodeURIComponent(city)}`);
      if (country) params.push(`country=${encodeURIComponent(country)}`);
      if (device)  params.push(`device=${encodeURIComponent(device)}`);
      if (params.length) url += "?" + params.join("&");
      const photos = await (await authFetch(url)).json();
      document.getElementById("photoCount").textContent = photos.length;
      renderGallery(photos);
    } catch(e) {
      document.getElementById("gallery").innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <h3>Verbindungsfehler</h3>
          <p>API nicht erreichbar. Bitte App Service prüfen.</p>
        </div>`;
    }
  }

  function renderGallery(photos) {
    const g = document.getElementById("gallery");
    if (!photos.length) {
      g.innerHTML = `
        <div class="empty-state">
          <div class="icon">📷</div>
          <h3>Noch keine Fotos</h3>
          <p>Lade dein erstes Foto hoch!</p>
        </div>`;
      return;
    }
    // Karten mit Lade-Platzhalter rendern
    g.innerHTML = photos.map(p => `
      <div class="photo-card" id="card-${p.id}" onclick="toggleSelect(event,${p.id})">
        <input type="checkbox" class="card-checkbox" data-id="${p.id}"
               onclick="event.stopPropagation()" onchange="onCheckbox(${p.id},this)">
        <div class="photo-thumb-wrap">
          <div class="img-placeholder" id="ph-${p.id}">
            <div class="mini-spinner"></div>
          </div>
          <img id="img-${p.id}" class="loading" src="" alt="${escHtml(p.filename)}"
               onclick="event.stopPropagation();openLightbox(${p.id},'${escHtml(p.filename)}','${escHtml(p.city||'')}','${escHtml(p.country||'')}','${escHtml(p.device||'')}')">
        </div>
        <div class="card-info">
          <div class="card-filename">${escHtml(p.filename)}</div>
          ${p.city
            ? `<div class="card-location">📍 ${escHtml(p.city)}, ${escHtml(p.country)}</div>`
            : '<div class="card-location no-location">Kein Standort</div>'}
          ${p.device ? `<div class="card-device">📷 ${escHtml(p.device)}</div>` : ''}
        </div>
      </div>`).join("");

    // Bilder asynchron über Backend-Proxy laden (löst den Blob-Storage-Zugriffsfehler)
    photos.forEach(p => loadImage(p.id));
    updateSelectedCount();
  }

  // Bild sicher über Auth-gesicherten Proxy laden
  async function loadImage(id) {
    try {
      const res  = await authFetch(`${API}/api/photos/${id}/image`);
      if (!res.ok) throw new Error("Bild nicht gefunden");
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      // Alte Blob-URL freigeben falls vorhanden
      if (blobUrls.has(id)) URL.revokeObjectURL(blobUrls.get(id));
      blobUrls.set(id, url);
      const img = document.getElementById(`img-${id}`);
      const ph  = document.getElementById(`ph-${id}`);
      if (img) {
        img.src = url;
        img.onload = () => {
          img.classList.remove("loading");
          img.classList.add("loaded");
          if (ph) ph.classList.add("hidden");
        };
      }
    } catch(e) {
      const ph = document.getElementById(`ph-${id}`);
      if (ph) ph.innerHTML = '<span style="font-size:28px;opacity:0.3">📷</span>';
    }
  }

  function escHtml(str) {
    return String(str||"")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function applyFilter() {
    const loc = document.getElementById("filterLocation").value;
    const dev = document.getElementById("filterDevice").value;
    let city="", country="";
    if (loc.startsWith("city:"))    city    = loc.slice(5);
    if (loc.startsWith("country:")) country = loc.slice(8);
    loadPhotos(city, country, dev);
  }

  let selectedFiles = [];
  function onFileSelect() {
    selectedFiles = Array.from(document.getElementById("fileInput").files);
    document.getElementById("uploadBtn").disabled = selectedFiles.length === 0;
    if (selectedFiles.length) setStatus(`${selectedFiles.length} Foto(s) bereit`, "loading");
  }

  async function uploadPhotos() {
    if (!selectedFiles.length) return;
    const overlay      = document.getElementById("uploadOverlay");
    const progressText = document.getElementById("uploadProgress");
    const progressFill = document.getElementById("progressFill");
    overlay.classList.add("active");
    let done = 0;
    for (const file of selectedFiles) {
      progressText.textContent = `${done+1} von ${selectedFiles.length} Fotos`;
      progressFill.style.width = `${(done/selectedFiles.length)*100}%`;
      const fd = new FormData();
      fd.append("photo", file);
      await authFetch(`${API}/api/photos`, { method: "POST", body: fd });
      done++;
    }
    progressFill.style.width = "100%";
    overlay.classList.remove("active");
    document.getElementById("fileInput").value = "";
    document.getElementById("uploadBtn").disabled = true;
    selectedFiles = [];
    setStatus(`✅ ${done} Foto(s) hochgeladen!`, "success");
    await Promise.all([loadPhotos(), loadLocations(), loadDevices()]);
  }

  function toggleSelect(event, id) {
    const cb = document.querySelector(`.card-checkbox[data-id="${id}"]`);
    if (!cb) return; cb.checked = !cb.checked; onCheckbox(id, cb);
  }
  function onCheckbox(id, cb) {
    const card = document.getElementById(`card-${id}`);
    if (cb.checked) card.classList.add("selected");
    else            card.classList.remove("selected");
    updateSelectedCount();
  }
  function selectAll()   {
    document.querySelectorAll(".card-checkbox").forEach(cb => {
      cb.checked = true;
      document.getElementById(`card-${cb.dataset.id}`)?.classList.add("selected");
    });
    updateSelectedCount();
  }
  function deselectAll() {
    document.querySelectorAll(".card-checkbox").forEach(cb => {
      cb.checked = false;
      document.getElementById(`card-${cb.dataset.id}`)?.classList.remove("selected");
    });
    updateSelectedCount();
  }
  function updateSelectedCount() {
    const n = document.querySelectorAll(".card-checkbox:checked").length;
    document.getElementById("selectedCount").textContent = n > 0 ? `${n} ausgewählt` : "";
  }

  async function downloadSelected() {
    const ids = [...document.querySelectorAll(".card-checkbox:checked")].map(c => +c.dataset.id);
    if (!ids.length) { setStatus("Bitte Fotos auswählen", "error"); return; }
    setStatus("⏳ ZIP wird erstellt...", "loading");
    const res  = await authFetch(`${API}/api/download`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids })
    });
    const blob = await res.blob();
    Object.assign(document.createElement("a"),
      { href: URL.createObjectURL(blob), download: "kvp-fotos.zip" }).click();
    setStatus(`✅ ${ids.length} Foto(s) heruntergeladen`, "success");
  }

  // Lightbox lädt ebenfalls über Backend-Proxy
  function openLightbox(id, filename, city, country, device) {
    const img = document.getElementById("lightboxImg");
    img.src = "";
    // Gecachte Blob-URL nutzen falls vorhanden, sonst neu laden
    if (blobUrls.has(id)) {
      img.src = blobUrls.get(id);
    } else {
      authFetch(`${API}/api/photos/${id}/image`)
        .then(r => r.blob())
        .then(blob => { img.src = URL.createObjectURL(blob); });
    }
    document.getElementById("lightboxInfo").textContent =
      city ? `📍 ${city}, ${country}  ·  ${filename}` : filename;
    document.getElementById("lightboxDevice").textContent =
      device ? `📷 ${device}` : "";
    document.getElementById("lightbox").classList.add("active");
  }
  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("active");
    document.getElementById("lightboxImg").src = "";
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });
</script>
</body>
</html>
