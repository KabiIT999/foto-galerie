<!DOCTYPE html>
<!--
  index.html – KVPCinematic Portfolio
  Design  : Apple-inspiriertes helles Interface
  Hosting : Netlify (statisches HTML, kein eigener Server)
  Backend : Azure App Service (Flask API)
  Auth    : HTTP Basic Auth (Credentials werden nie im Browser gespeichert)
  Bilder  : Werden über Backend-Proxy geladen (kein öffentlicher Blob-Zugriff)
-->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KVPCinematic Portfolio</title>
  <!-- Google Fonts: Entspricht SF Pro (Apple Font) am nächsten -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════════════════
       CSS-VARIABLEN – Apple Design System
       ═══════════════════════════════════════════════════════════════════════ */
    :root {
      /* Hintergründe */
      --bg:          #ffffff;
      --bg-alt:      #f5f5f7;      /* Apple: hellgrau für Sektionen */
      --bg-hover:    #f0f0f2;

      /* Text */
      --text:        #1d1d1f;      /* Apple: fast-schwarz */
      --text-muted:  #6e6e73;      /* Apple: mittleres Grau */
      --text-light:  #aeaeb2;      /* Apple: helles Grau */

      /* Rahmen & Schatten */
      --border:      #d2d2d7;      /* Apple: sehr helles Grau */
      --shadow-sm:   0 1px 4px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md:   0 4px 16px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.05);
      --shadow-lg:   0 12px 40px rgba(0,0,0,.12);

      /* Akzentfarben */
      --blue:        #0071e3;      /* Apple: primäres Blau */
      --blue-hover:  #0077ed;
      --blue-light:  #e8f2ff;
      --red:         #ff3b30;      /* Apple: Löschen/Fehler */
      --red-hover:   #ff2d20;
      --red-light:   #fff0ef;
      --green:       #34c759;      /* Apple: Erfolg */
      --orange:      #ff9500;      /* Admin-Badge */

      /* Layout */
      --radius-sm:   6px;
      --radius:      10px;
      --radius-lg:   14px;
      --header-h:    58px;
    }

    /* ── Reset & Basis ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-alt);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       LOGIN – Vollbild-Overlay
       ═══════════════════════════════════════════════════════════════════════ */
    .login-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: var(--bg-alt);
      display: flex; align-items: center; justify-content: center;
    }
    .login-overlay.hidden { display: none; }

    .login-card {
      background: var(--bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 48px 44px;
      width: 100%; max-width: 380px;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }

    /* Kamera-Logo im Login */
    .login-logo {
      display: inline-flex; align-items: center; justify-content: center;
      width: 64px; height: 64px; background: var(--bg-alt);
      border-radius: 16px; border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .login-logo svg { color: var(--blue); }

    .login-card h1 {
      font-size: 22px; font-weight: 700;
      letter-spacing: -0.3px; margin-bottom: 4px;
    }
    .login-card h1 .cinema { color: var(--blue); }
    .login-card p {
      font-size: 13px; color: var(--text-muted);
      margin-bottom: 28px;
    }

    .login-card input {
      display: block; width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 15px; font-family: inherit; color: var(--text);
      background: var(--bg); margin-bottom: 10px;
      transition: border-color .15s, box-shadow .15s;
    }
    .login-card input:focus {
      outline: none; border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0,113,227,.12);
    }
    .login-card input::placeholder { color: var(--text-light); }

    .btn-login {
      display: block; width: 100%; margin-top: 6px;
      padding: 12px; background: var(--blue); color: #fff;
      border: none; border-radius: var(--radius-sm);
      font-size: 15px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: background .15s;
    }
    .btn-login:hover { background: var(--blue-hover); }

    .login-error {
      margin-top: 10px; font-size: 13px; color: var(--red); display: none;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       HEADER – Klebt oben, weiss mit feinem Schatten
       ═══════════════════════════════════════════════════════════════════════ */
    header {
      height: var(--header-h);
      background: rgba(255,255,255,.9);
      backdrop-filter: saturate(180%) blur(12px);   /* Apple: Unschärfe-Effekt */
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }

    /* Logo + Navigation */
    .header-left { display: flex; align-items: center; gap: 28px; }
    .logo {
      display: flex; align-items: center; gap: 9px;
      font-size: 17px; font-weight: 700;
      letter-spacing: -0.2px; text-decoration: none; color: var(--text);
    }
    .logo .cinema { color: var(--blue); }
    .logo .port   { font-weight: 400; color: var(--text-muted); }

    /* Kamera-Icon im Header (kleiner als im Login) */
    .logo-icon {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      background: var(--blue-light); border-radius: 8px;
    }
    .logo-icon svg { color: var(--blue); }

    /* Nav-Tabs (Galerie / Benutzer) */
    .nav-tabs { display: flex; gap: 4px; }
    .nav-tab {
      padding: 6px 14px; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 500; color: var(--text-muted);
      background: transparent; border: none; cursor: pointer;
      font-family: inherit; transition: all .15s;
    }
    .nav-tab:hover   { background: var(--bg-hover); color: var(--text); }
    .nav-tab.active  { background: var(--bg-alt);   color: var(--blue); font-weight: 600; }
    .nav-tab.hidden  { display: none; }  /* Benutzer-Tab nur für Admins */

    /* Rechte Seite: Benutzer-Badge + Rollen-Badge + Logout */
    .header-right { display: flex; align-items: center; gap: 10px; }
    .user-info    { font-size: 13px; color: var(--text-muted); }
    .role-badge {
      display: inline-block; padding: 2px 9px; border-radius: 20px;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .5px;
    }
    .role-badge.admin  { background: #fff3e0; color: var(--orange); }
    .role-badge.user   { background: #e3f4ec; color: #1a7a3d; }
    .role-badge.viewer { background: var(--bg-alt); color: var(--text-muted); }

    .btn-logout {
      padding: 6px 14px; background: var(--bg-alt);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500; color: var(--text-muted);
      cursor: pointer; font-family: inherit; transition: all .15s;
    }
    .btn-logout:hover { background: var(--bg-hover); color: var(--text); }

    /* ═══════════════════════════════════════════════════════════════════════
       TOOLBAR – Aktionsleiste unter dem Header
       ═══════════════════════════════════════════════════════════════════════ */
    .toolbar {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 40px;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 980px;  /* Apple: sehr runde Buttons */
      font-family: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer; border: none; transition: all .15s;
      white-space: nowrap; text-decoration: none;
    }
    .btn:disabled { opacity: .35; cursor: not-allowed; }

    /* Primär (blau) – Hauptaktion */
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--blue-hover); }

    /* Sekundär (grau) – Nebenahtion */
    .btn-secondary {
      background: var(--bg-alt); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover:not(:disabled) { background: var(--bg-hover); }

    /* Gefährlich (rot) – Löschen */
    .btn-danger { background: var(--red-light); color: var(--red); }
    .btn-danger:hover:not(:disabled) { background: var(--red); color: #fff; }

    /* Upload-Label (verhält sich wie ein Button) */
    .btn-upload {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 980px;
      font-family: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer; background: var(--blue); color: #fff;
      transition: background .15s; white-space: nowrap;
    }
    .btn-upload:hover { background: var(--blue-hover); }

    /* Verstecktes File-Input → wird über Label ausgelöst */
    #fileInput { display: none; }

    /* Filter-Dropdowns */
    select {
      padding: 8px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--bg);
      font-family: inherit; font-size: 13px; color: var(--text);
      cursor: pointer; transition: border-color .15s;
    }
    select:focus { outline: none; border-color: var(--blue); }

    /* Trennlinie in der Toolbar */
    .sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

    /* Status-Meldung (Erfolg/Fehler/Laden) */
    #status {
      font-size: 12px; font-weight: 500; padding: 5px 12px;
      border-radius: 20px; display: none;
    }
    #status.loading { background: var(--bg-alt); color: var(--text-muted); display: block; }
    #status.success { background: #e3f4ec; color: #1a7a3d; display: block; }
    #status.error   { background: var(--red-light); color: var(--red); display: block; }

    /* ═══════════════════════════════════════════════════════════════════════
       STATS-BAR – Zusammenfassung (Anzahl Fotos/Orte/Geräte)
       ═══════════════════════════════════════════════════════════════════════ */
    .stats-bar {
      background: var(--bg); padding: 8px 40px;
      border-bottom: 1px solid var(--border);
      display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
    }
    .stat { font-size: 12px; color: var(--text-muted); }
    .stat strong { color: var(--text); font-weight: 600; }
    #selectedCount {
      margin-left: auto; font-size: 12px; font-weight: 600; color: var(--blue);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       GALERIE – CSS Grid
       ═══════════════════════════════════════════════════════════════════════ */
    .gallery-wrapper { padding: 24px 40px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    /* ── Foto-Karte ── */
    .photo-card {
      background: var(--bg); border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      overflow: hidden; cursor: pointer;
      transition: box-shadow .2s, transform .2s;
      position: relative;
    }
    .photo-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    /* Goldrahmen wenn ausgewählt */
    .photo-card.selected {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    /* Bildbereich mit Lade-Platzhalter */
    .photo-thumb {
      position: relative; width: 100%; height: 200px;
      background: var(--bg-alt); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .photo-thumb img {
      width: 100%; height: 100%; object-fit: cover;
      cursor: zoom-in; opacity: 0;
      transition: opacity .3s;
    }
    .photo-thumb img.loaded { opacity: 1; }

    /* Spinner-Platzhalter solange Bild lädt */
    .thumb-placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .thumb-placeholder.hidden { display: none; }
    .mini-spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border); border-top-color: var(--blue);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Checkbox oben-links */
    .card-checkbox {
      position: absolute; top: 10px; left: 10px;
      width: 19px; height: 19px; accent-color: var(--blue);
      cursor: pointer; z-index: 3;
    }

    /* Löschen-Button oben-rechts (nur für Admin sichtbar) */
    .btn-delete-card {
      position: absolute; top: 8px; right: 8px; z-index: 3;
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(255,255,255,.9); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .15s;
      opacity: 0;          /* Standardmässig unsichtbar */
    }
    .photo-card:hover .btn-delete-card { opacity: 1; }
    .btn-delete-card:hover {
      background: var(--red); border-color: var(--red); color: #fff;
    }
    .btn-delete-card svg { pointer-events: none; }
    .btn-delete-card.hidden { display: none; }

    /* Karten-Info unter dem Bild */
    .card-info { padding: 12px 14px; }
    .card-filename {
      font-size: 11px; color: var(--text-muted); margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-location { font-size: 13px; font-weight: 500; color: var(--text); }
    .card-location.no-loc { color: var(--text-light); font-style: italic; font-weight: 400; }
    .card-device { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .card-uploader {
      font-size: 10px; color: var(--text-light); margin-top: 4px;
      font-weight: 500; text-transform: uppercase; letter-spacing: .3px;
    }

    /* ── Leer-Zustand & Ladezustand ── */
    .empty-state {
      grid-column: 1/-1; text-align: center; padding: 80px 24px;
      color: var(--text-muted);
    }
    .empty-state .icon { font-size: 44px; margin-bottom: 12px; opacity: .4; }
    .empty-state h3 { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .empty-state p  { font-size: 14px; }
    .loading-grid { grid-column: 1/-1; display: flex; justify-content: center; padding: 80px; }
    .spinner {
      width: 32px; height: 32px;
      border: 2px solid var(--border); border-top-color: var(--blue);
      border-radius: 50%; animation: spin .7s linear infinite;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       UPLOAD-OVERLAY – Fortschrittsanzeige
       ═══════════════════════════════════════════════════════════════════════ */
    .upload-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.3); backdrop-filter: blur(4px);
      align-items: center; justify-content: center;
    }
    .upload-overlay.active { display: flex; }
    .upload-modal {
      background: var(--bg); border-radius: var(--radius-lg);
      border: 1px solid var(--border); padding: 36px 44px;
      min-width: 280px; text-align: center;
      box-shadow: var(--shadow-lg);
    }
    .upload-modal h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .upload-modal p  { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }
    .progress-bar    { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .progress-fill   { height: 100%; background: var(--blue); border-radius: 2px; transition: width .25s; }

    /* ═══════════════════════════════════════════════════════════════════════
       LIGHTBOX – Vollansicht
       ═══════════════════════════════════════════════════════════════════════ */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.88); backdrop-filter: blur(8px);
      flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 92vw; max-height: 78vh; object-fit: contain;
      border-radius: 6px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .lightbox-info   { color: #fff; font-size: 14px; font-weight: 500; }
    .lightbox-device { color: rgba(255,255,255,.55); font-size: 12px; }
    .btn-lightbox-close {
      position: absolute; top: 20px; right: 24px;
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.2);
      color: #fff; border-radius: 50%; width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; transition: background .15s;
    }
    .btn-lightbox-close:hover { background: rgba(255,255,255,.25); }

    /* ═══════════════════════════════════════════════════════════════════════
       BENUTZERVERWALTUNG – Admin-Bereich
       ═══════════════════════════════════════════════════════════════════════ */
    .users-wrapper { padding: 24px 40px; display: none; }
    .users-wrapper.active { display: block; }

    .users-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .users-header h2 { font-size: 20px; font-weight: 700; letter-spacing: -.2px; }

    /* Neuen Benutzer anlegen – Formular */
    .new-user-form {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 24px;
      margin-bottom: 20px; display: none;
    }
    .new-user-form.active { display: block; }
    .new-user-form h3 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .form-field { display: flex; flex-direction: column; gap: 4px; }
    .form-field label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; }
    .form-field input,
    .form-field select {
      padding: 9px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); font-family: inherit; font-size: 14px;
      color: var(--text); background: var(--bg);
    }
    .form-field input:focus,
    .form-field select:focus { outline: none; border-color: var(--blue); }

    /* Benutzer-Tabelle */
    .users-table-wrap {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--bg-alt); }
    th {
      padding: 10px 16px; text-align: left;
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .4px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px 16px; font-size: 14px;
      border-bottom: 1px solid var(--border);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td      { background: var(--bg-alt); }

    /* Rollen-Badges in Tabelle */
    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 20px;
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
    }
    .badge.admin  { background: #fff3e0; color: var(--orange); }
    .badge.user   { background: #e3f4ec; color: #1a7a3d; }
    .badge.viewer { background: var(--bg-alt); color: var(--text-muted); }

    /* ═══════════════════════════════════════════════════════════════════════
       RESPONSIVE – Mobile Anpassungen
       ═══════════════════════════════════════════════════════════════════════ */
    @media (max-width: 640px) {
      header, .toolbar, .gallery-wrapper, .stats-bar,
      .users-wrapper { padding-left: 16px; padding-right: 16px; }
      .gallery { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .photo-thumb { height: 155px; }
      .header-left .nav-tabs { display: none; }
      .logo .port { display: none; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════════
     LOGIN-OVERLAY
     Erscheint beim ersten Öffnen und nach dem Ausloggen.
     Sendet einen Test-Request an /api/photos um Credentials zu prüfen.
     ═══════════════════════════════════════════════════════════════════════ -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <!-- Kamera-Icon -->
    <div class="login-logo">
      <svg width="28" height="24" viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="7" width="26" height="16" rx="3"/>
        <path d="M9 7V5.5C9 4.7 9.7 4 10.5 4h7C18.3 4 19 4.7 19 5.5V7"/>
        <circle cx="14" cy="15" r="4.5"/>
        <circle cx="14" cy="15" r="1.8" fill="currentColor" stroke="none"/>
        <circle cx="22.5" cy="11" r="1" fill="currentColor" stroke="none" opacity=".6"/>
      </svg>
    </div>

    <h1>KVP<span class="cinema">Cinematic</span></h1>
    <p>Portfolio · Privater Zugang</p>

    <input type="text"     id="loginUser" placeholder="Benutzername"
           autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
    <input type="password" id="loginPass" placeholder="Passwort"
           autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-login" onclick="doLogin()">Einloggen</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════
     HEADER
     Klebt oben. Zeigt Logo, Nav-Tabs, Benutzer-Info und Logout.
     Die "Benutzer"-Tab ist nur für Admins sichtbar (wird per JS eingeblendet).
     ═══════════════════════════════════════════════════════════════════════ -->
<header>
  <div class="header-left">
    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">

<!-- ═══════════════════════════════════════════════════════════════════════
     JAVASCRIPT
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
  // ── Konfiguration ──────────────────────────────────────────────────────────
  // Backend-URL: zeigt auf den Azure App Service
  const API = "https://app-fotogalerie-prod-f2cha4hehrgpefbt.germanywestcentral-01.azurewebsites.net";

  // ── Globaler Zustand ───────────────────────────────────────────────────────
  let authHeader = "";    // HTTP Basic Auth Header (Base64)
  let currentUser = null; // {id, username, role, display_name}

  // Blob-URLs für Bilder: Map<photo_id → objectURL>
  // Werden beim Logout freigegeben um Speicher zu schonen
  const blobUrls = new Map();


  // ═══════════════════════════════════════════════════════════════════════
  // AUTHENTIFIZIERUNG
  // ═══════════════════════════════════════════════════════════════════════

  /**
   * Login: Credentials werden als HTTP Basic Auth Header kodiert.
   * Test-Request an /api/me → bei Erfolg: App laden, Rolle bestimmen.
   */
  function doLogin() {
    const u = document.getElementById("loginUser").value.trim();
    const p = document.getElementById("loginPass").value;
    if (!u || !p) return;

    // Base64-Kodierung: "username:password" → "Basic dXNlcjpwYXNz"
    authHeader = "Basic " + btoa(u + ":" + p);

    // Benutzerinfo laden (inkl. Rolle)
    // Timeout nach 8 Sekunden → App möglicherweise nicht erreichbar
    const controller = new AbortController();
    const timeout    = setTimeout(() => controller.abort(), 8000);

    fetch(`${API}/api/me`, {
      headers: { "Authorization": authHeader },
      signal: controller.signal
    })
      .then(async r => {
        clearTimeout(timeout);
        if (r.status === 401) {
          // Falsches Passwort / Benutzername nicht vorhanden
          showLoginError("Falscher Benutzername oder Passwort");
          authHeader = "";
        } else if (!r.ok) {
          // Server antwortet, aber mit Fehler (z.B. 500)
          showLoginError("Server-Fehler. Bitte später versuchen.");
          authHeader = "";
        } else {
          currentUser = await r.json();
          document.getElementById("loginOverlay").classList.add("hidden");
          document.getElementById("loginError").style.display = "none";
          setupUI();   // UI an Rolle anpassen
          init();      // Daten laden
        }
      })
      .catch(err => {
        clearTimeout(timeout);
        authHeader = "";
        // Unterscheide zwischen Timeout (App down) und Netzwerkfehler
        if (err.name === "AbortError") {
          showLoginError("⚠️ WebApp nicht erreichbar. Bitte den IT kontaktieren.");
        } else {
          showLoginError("⚠️ Verbindung fehlgeschlagen. WebApp möglicherweise nicht aktiv.");
        }
      });
  }

  /** Zeigt eine Fehlermeldung im Login-Formular an. */
  function showLoginError(msg) {
    const el = document.getElementById("loginError");
    el.textContent   = msg;
    el.style.display = "block";
  }

  /**
   * Logout: Auth-Header + Benutzerinfos löschen, Blob-URLs freigeben.
   */
  function doLogout() {
    blobUrls.forEach(url => URL.revokeObjectURL(url));
    blobUrls.clear();
    authHeader  = "";
    currentUser = null;
    document.getElementById("loginUser").value = "";
    document.getElementById("loginPass").value = "";
    document.getElementById("loginOverlay").classList.remove("hidden");
    document.getElementById("gallery").innerHTML = '<div class="loading-grid"><div class="spinner"></div></div>';
    // Benutzer-Tab beim Ausloggen wieder verstecken (wichtig bei Rollenwechsel)
    document.getElementById("tabUsers").classList.add("hidden");
    document.getElementById("uploadLabel").style.display = "";
    showGallery();  // zurück zur Galerie-Ansicht
  }

  /**
   * Hilfsfunktion: fetch() immer mit Authorization-Header senden.
   */
  function authFetch(url, options = {}) {
    return fetch(url, {
      ...options,
      headers: { ...options.headers, "Authorization": authHeader }
    });
  }

  /**
   * UI nach dem Login an die Benutzer-Rolle anpassen.
   * - admin:  Alle Buttons sichtbar, Benutzer-Tab sichtbar
   * - user:   Upload sichtbar, kein Benutzer-Tab, kein Löschen
   * - viewer: Kein Upload, kein Benutzer-Tab, kein Löschen
   */
  function setupUI() {
    if (!currentUser) return;
    const { role, display_name, username } = currentUser;

    // Benutzer-Info im Header
    document.getElementById("headerUserInfo").textContent = display_name || username;
    const badge = document.getElementById("headerRoleBadge");
    badge.textContent = role;
    badge.className   = `role-badge ${role}`;

    // Benutzer-Tab (nur Admin)
    if (role === "admin") {
      document.getElementById("tabUsers").classList.remove("hidden");
    }

    // Upload-Button (viewer hat keinen Upload)
    document.getElementById("uploadLabel").style.display =
      role === "viewer" ? "none" : "";
  }


  // ═══════════════════════════════════════════════════════════════════════
  // INITIALISIERUNG
  // ═══════════════════════════════════════════════════════════════════════

  /**
   * Lädt alle Daten parallel: Orte, Geräte, Fotos.
   */
  async function init() {
    await Promise.all([loadLocations(), loadDevices(), loadPhotos()]);
  }


  // ═══════════════════════════════════════════════════════════════════════
  // NAVIGATION (Galerie / Benutzer)
  // ═══════════════════════════════════════════════════════════════════════

  function showGallery() {
    document.getElementById("galleryWrapper").style.display = "block";
    document.getElementById("usersWrapper").classList.remove("active");
    document.getElementById("toolbar").style.display = "";
    document.getElementById("tabGallery").classList.add("active");
    document.getElementById("tabUsers").classList.remove("active");
  }

  function showUsers() {
    document.getElementById("galleryWrapper").style.display = "none";
    document.getElementById("usersWrapper").classList.add("active");
    document.getElementById("toolbar").style.display = "none";
    document.getElementById("tabGallery").classList.remove("active");
    document.getElementById("tabUsers").classList.add("active");
    loadUsers();
  }


  // ═══════════════════════════════════════════════════════════════════════
  // STATUS-MELDUNGEN
  // ═══════════════════════════════════════════════════════════════════════

  /**
   * Zeigt eine Meldung in der Toolbar an.
   * @param {string} msg   – Anzuzeigender Text
   * @param {string} type  – "loading" | "success" | "error"
   */
  function setStatus(msg, type = "loading") {
    const el = document.getElementById("status");
    el.textContent = msg; el.className = type;
    if (type !== "loading") {
      setTimeout(() => { el.className = ""; el.textContent = ""; }, 4000);
    }
  }


  // ═══════════════════════════════════════════════════════════════════════
  // FILTER-DROPDOWNS
  // ═══════════════════════════════════════════════════════════════════════

  /**
   * Lädt alle verfügbaren Orte aus der API und befüllt den Location-Dropdown.
   * Gruppiert nach Land (als <optgroup>) und zeigt Städte darunter.
   */
  async function loadLocations() {
    try {
      const locs = await (await authFetch(`${API}/api/locations`)).json();
      const sel  = document.getElementById("filterLocation");
      sel.innerHTML = '<option value="">Alle Orte</option>';

      // Länder als Gruppe
      const countries = [...new Set(locs.map(l => l.country))].filter(Boolean);
      if (countries.length) {
        const g = document.createElement("optgroup"); g.label = "Nach Land";
        countries.forEach(c => {
          const o = document.createElement("option");
          o.value = `country:${c}`; o.text = `${c}`; g.appendChild(o);
        });
        sel.appendChild(g);
      }
      // Städte als Gruppe
      const cities = locs.filter(l => l.city);
      if (cities.length) {
        const g = document.createElement("optgroup"); g.label = "Nach Stadt";
        cities.forEach(l => {
          const o = document.createElement("option");
          o.value = `city:${l.city}`; o.text = `${l.city}, ${l.country}`; g.appendChild(o);
        });
        sel.appendChild(g);
      }
      document.getElementById("locationCount").textContent = locs.length;
    } catch(e) { console.error("loadLocations:", e); }
  }

  /**
   * Lädt alle verfügbaren Geräte aus der API und befüllt den Device-Dropdown.
   */
  async function loadDevices() {
    try {
      const devs = await (await authFetch(`${API}/api/devices`)).json();
      const sel  = document.getElementById("filterDevice");
      sel.innerHTML = '<option value="">Alle Geräte</option>';
      devs.forEach(d => {
        const o = document.createElement("option");
        o.value = d.device; o.text = d.device; sel.appendChild(o);
      });
      document.getElementById("deviceCount").textContent = devs.length;
    } catch(e) { console.error("loadDevices:", e); }
  }

  /**
   * Liest die aktuellen Filter aus den Dropdowns und lädt die Fotos neu.
   */
  function applyFilter() {
    const loc     = document.getElementById("filterLocation").value;
    const dev     = document.getElementById("filterDevice").value;
    let city = "", country = "";
    if (loc.startsWith("city:"))    city    = loc.slice(5);
    if (loc.startsWith("country:")) country = loc.slice(8);
    loadPhotos(city, country, dev);
  }


  // ═══════════════════════════════════════════════════════════════════════
  // FOTOS LADEN & RENDERN
  // ═══════════════════════════════════════════════════════════════════════

  /**
   * Lädt Fotos vom Backend (optional mit Filtern) und rendert die Galerie.
   */
  async function loadPhotos(city = "", country = "", device = "") {
    document.getElementById("gallery").innerHTML =
      '<div class="loading-grid"><div class="spinner"></div></div>';
    try {
      let url    = `${API}/api/photos`;
      const p    = [];
      if (city)    p.push(`city=${encodeURIComponent(city)}`);
      if (country) p.push(`country=${encodeURIComponent(country)}`);
      if (device)  p.push(`device=${encodeURIComponent(device)}`);
      if (p.length) url += "?" + p.join("&");

      const photos = await (await authFetch(url)).json();
      document.getElementById("photoCount").textContent = photos.length;
      renderGallery(photos);
    } catch(e) {
      document.getElementById("gallery").innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <h3>Verbindungsfehler</h3>
          <p>API nicht erreichbar. Bitte App Service prüfen.</p>
        </div>`;
    }
  }

  /**
   * Rendert die Galerie aus einem Array von Foto-Objekten.
   * Bilder werden asynchron über den Backend-Proxy geladen (loadImage).
   * Admin-Benutzer sehen einen Löschen-Button auf jeder Karte.
   */
  function renderGallery(photos) {
    const g   = document.getElementById("gallery");
    const isAdmin = currentUser?.role === "admin";

    if (!photos.length) {
      g.innerHTML = `
        <div class="empty-state">
          <div class="icon">📷</div>
          <h3>Noch keine Fotos</h3>
          <p>Lade dein erstes Foto hoch!</p>
        </div>`;
      return;
    }

    // HTML für alle Karten generieren (Bilder werden später asynchron geladen)
    g.innerHTML = photos.map(p => `
      <div class="photo-card" id="card-${p.id}" onclick="toggleSelect(event,${p.id})">

        <!-- Checkbox für Mehrfachauswahl -->
        <input type="checkbox" class="card-checkbox" data-id="${p.id}"
               onclick="event.stopPropagation()" onchange="onCheckbox(${p.id},this)">

        <!-- Löschen-Button (nur Admin, erscheint beim Hovern) -->
        <button class="btn-delete-card ${isAdmin ? '' : 'hidden'}"
                onclick="event.stopPropagation();deletePhoto(${p.id},'${esc(p.filename)}')"
                title="Foto löschen">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </button>

        <!-- Bildbereich mit Lade-Spinner -->
        <div class="photo-thumb">
          <div class="thumb-placeholder" id="ph-${p.id}">
            <div class="mini-spinner"></div>
          </div>
          <img id="img-${p.id}" src="" alt="${esc(p.filename)}"
               onclick="event.stopPropagation();
                        openLightbox(${p.id},'${esc(p.filename)}',
                          '${esc(p.city||'')}','${esc(p.country||'')}',
                          '${esc(p.device||'')}')">
        </div>

        <!-- Karten-Info -->
        <div class="card-info">
          <div class="card-filename">${esc(p.filename)}</div>
          ${p.city
            ? `<div class="card-location">📍 ${esc(p.city)}, ${esc(p.country)}</div>`
            : '<div class="card-location no-loc">Kein Standort</div>'}
          ${p.device
            ? `<div class="card-device">${esc(p.device)}</div>`
            : ''}
          ${isAdmin && p.uploader
            ? `<div class="card-uploader">↑ ${esc(p.uploader)}</div>`
            : ''}
        </div>
      </div>`).join("");

    // Alle Bilder asynchron über Backend-Proxy laden
    photos.forEach(p => loadImage(p.id));
    updateSelectedCount();
  }

  /**
   * Lädt ein einzelnes Bild über den authentifizierten Backend-Proxy.
   * Da <img src> keine Auth-Header senden kann, nutzen wir fetch() + createObjectURL().
   * Gecachte Blob-URLs werden wiederverwendet (kein doppelter Download).
   */
  async function loadImage(id) {
    try {
      // Falls Bild bereits geladen: Blob-URL wiederverwenden
      if (blobUrls.has(id)) {
        applyBlobUrl(id, blobUrls.get(id));
        return;
      }
      // Bild mit Auth vom Backend laden
      const res  = await authFetch(`${API}/api/photos/${id}/image`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);  // Temporäre Browser-URL
      blobUrls.set(id, url);
      applyBlobUrl(id, url);
    } catch(e) {
      // Fehler-Placeholder anzeigen
      const ph = document.getElementById(`ph-${id}`);
      if (ph) ph.innerHTML = '<span style="font-size:28px;opacity:.25">📷</span>';
      console.warn(`Bild ${id} konnte nicht geladen werden:`, e);
    }
  }

  /** Setzt die Blob-URL auf das <img> Element und blendet Spinner aus. */
  function applyBlobUrl(id, url) {
    const img = document.getElementById(`img-${id}`);
    const ph  = document.getElementById(`ph-${id}`);
    if (img) {
      img.src    = url;
      img.onload = () => { img.classList.add("loaded"); if (ph) ph.classList.add("hidden"); };
    }
  }

  /** HTML-Sonderzeichen escapen für sichere Template-Strings. */
  function esc(str) {
    return String(str || "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }


  // ═══════════════════════════════════════════════════════════════════════
  // UPLOAD – Kombinierter Select + Auto-Upload
  // ═══════════════════════════════════════════════════════════════════════

  /**
   * Öffnet den Datei-Picker per JavaScript.
   * Zuverlässiger als label+for auf iOS Safari / Android Chrome.
   * Muss direkt in einem User-Interaction-Handler aufgerufen werden (onclick).
   */
  function triggerFileInput() {
    document.getElementById("fileInput").click();
  }

  /**
   * Wird direkt aufgerufen wenn der Benutzer Dateien ausgewählt hat.
   * Zeigt Upload-Overlay → lädt alle Dateien hoch → aktualisiert Galerie.
   */
  async function autoUpload() {
    const input = document.getElementById("fileInput");
    const files = Array.from(input.files);
    if (!files.length) return;

    const overlay      = document.getElementById("uploadOverlay");
    const progressText = document.getElementById("uploadProgress");
    const progressFill = document.getElementById("progressFill");

    overlay.classList.add("active");  // Overlay einblenden
    let done = 0, errors = 0;

    for (const file of files) {
      progressText.textContent = `${done + 1} von ${files.length}: ${file.name}`;
      progressFill.style.width = `${(done / files.length) * 100}%`;

      const fd = new FormData();
      fd.append("photo", file);  // Multipart-Upload

      try {
        const res = await authFetch(`${API}/api/photos`, { method: "POST", body: fd });
        if (!res.ok) errors++;
      } catch(e) {
        errors++;
        console.error(`Upload-Fehler ${file.name}:`, e);
      }
      done++;
    }

    progressFill.style.width = "100%";
    overlay.classList.remove("active");
    input.value = "";  // File-Input zurücksetzen

    const msg = errors > 0
      ? `${done - errors} hochgeladen, ${errors} fehlgeschlagen`
      : `✓ ${done} Foto${done !== 1 ? "s" : ""} hochgeladen`;
    setStatus(msg, errors > 0 ? "error" : "success");

    // Galerie und Filter-Dropdowns neu laden
    await Promise.all([loadPhotos(), loadLocations(), loadDevices()]);
  }


  // ═══════════════════════════════════════════════════════════════════════
  // AUSWAHL (Checkboxen)
  // ═══════════════════════════════════════════════════════════════════════

  /** Klick auf Karte → Checkbox umschalten. */
  function toggleSelect(event, id) {
    const cb = document.querySelector(`.card-checkbox[data-id="${id}"]`);
    if (!cb) return;
    cb.checked = !cb.checked;
    onCheckbox(id, cb);
  }

  /** Checkbox-Zustand → Goldrahmen auf Karte setzen/entfernen. */
  function onCheckbox(id, cb) {
    document.getElementById(`card-${id}`)
      ?.classList.toggle("selected", cb.checked);
    updateSelectedCount();
  }

  function selectAll() {
    document.querySelectorAll(".card-checkbox").forEach(cb => {
      cb.checked = true;
      document.getElementById(`card-${cb.dataset.id}`)?.classList.add("selected");
    });
    updateSelectedCount();
  }

  function deselectAll() {
    document.querySelectorAll(".card-checkbox").forEach(cb => {
      cb.checked = false;
      document.getElementById(`card-${cb.dataset.id}`)?.classList.remove("selected");
    });
    updateSelectedCount();
  }

  function updateSelectedCount() {
    const n = document.querySelectorAll(".card-checkbox:checked").length;
    document.getElementById("selectedCount").textContent = n > 0 ? `${n} ausgewählt` : "";
  }


  // ═══════════════════════════════════════════════════════════════════════
  // FOTO LÖSCHEN
  // ═══════════════════════════════════════════════════════════════════════

  /**
   * Löscht ein Foto nach Bestätigung.
   * Nur Admins dürfen diese Funktion aufrufen (Button ist nur für Admin sichtbar).
   * @param {number} id       – Photo-ID
   * @param {string} filename – Dateiname (für Bestätigungsdialog)
   */
  async function deletePhoto(id, filename) {
    if (!confirm(`Foto wirklich löschen?\n\n${filename}\n\nDiese Aktion kann nicht rückgängig gemacht werden.`))
      return;

    try {
      const res = await authFetch(`${API}/api/photos/${id}`, { method: "DELETE" });
      if (res.ok) {
        // Blob-URL freigeben und Karte aus DOM entfernen
        if (blobUrls.has(id)) {
          URL.revokeObjectURL(blobUrls.get(id));
          blobUrls.delete(id);
        }
        document.getElementById(`card-${id}`)?.remove();
        const count = parseInt(document.getElementById("photoCount").textContent) || 1;
        document.getElementById("photoCount").textContent = Math.max(0, count - 1);
        setStatus("Foto gelöscht", "success");
      } else {
        const err = await res.json();
        setStatus(err.error || "Löschen fehlgeschlagen", "error");
      }
    } catch(e) {
      setStatus("Verbindungsfehler beim Löschen", "error");
    }
  }


  // ═══════════════════════════════════════════════════════════════════════
  // ZIP-DOWNLOAD
  // ═══════════════════════════════════════════════════════════════════════

  /**
   * Lädt alle ausgewählten Fotos als ZIP-Datei herunter.
   */
  async function downloadSelected() {
    const ids = [...document.querySelectorAll(".card-checkbox:checked")]
                  .map(c => +c.dataset.id);
    if (!ids.length) { setStatus("Bitte Fotos auswählen", "error"); return; }

    setStatus("ZIP wird erstellt…", "loading");
    try {
      const res  = await authFetch(`${API}/api/download`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids })
      });
      const blob = await res.blob();
      // Temporären Link erstellen und klicken → Browser-Download
      const a    = document.createElement("a");
      a.href     = URL.createObjectURL(blob);
      a.download = "kvp-portfolio.zip";
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus(`✓ ${ids.length} Foto${ids.length !== 1 ? "s" : ""} heruntergeladen`, "success");
    } catch(e) {
      setStatus("ZIP-Download fehlgeschlagen", "error");
    }
  }


  // ═══════════════════════════════════════════════════════════════════════
  // LIGHTBOX
  // ═══════════════════════════════════════════════════════════════════════

  /**
   * Öffnet die Lightbox mit dem Foto in voller Grösse.
   * Nutzt gecachte Blob-URL oder lädt das Bild neu.
   */
  function openLightbox(id, filename, city, country, device) {
    const img = document.getElementById("lightboxImg");
    img.src   = "";  // Altes Bild entfernen

    // Gecachte Blob-URL verwenden → kein erneuter Download
    if (blobUrls.has(id)) {
      img.src = blobUrls.get(id);
    } else {
      authFetch(`${API}/api/photos/${id}/image`)
        .then(r => r.blob())
        .then(blob => { img.src = URL.createObjectURL(blob); });
    }

    document.getElementById("lightboxInfo").textContent =
      city ? `📍 ${city}, ${country}  ·  ${filename}` : filename;
    document.getElementById("lightboxDevice").textContent = device || "";
    document.getElementById("lightbox").classList.add("active");
  }

  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("active");
  }

  // ESC-Taste schliesst die Lightbox
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });


  // ═══════════════════════════════════════════════════════════════════════
  // BENUTZERVERWALTUNG (Admin)
  // ═══════════════════════════════════════════════════════════════════════

  /** Lädt alle Benutzer aus der API und rendert die Tabelle. */
  async function loadUsers() {
    const tbody = document.getElementById("usersTableBody");
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:24px">Wird geladen…</td></tr>';
    try {
      const users = await (await authFetch(`${API}/api/users`)).json();
      if (!users.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:24px">Keine Benutzer</td></tr>';
        return;
      }
      tbody.innerHTML = users.map(u => `
        <tr id="user-row-${u.id}">
          <td><strong>${esc(u.username)}</strong></td>
          <td>${esc(u.display_name || "–")}</td>
          <td><span class="badge ${u.role}">${u.role}</span></td>
          <td style="color:var(--text-muted);font-size:12px">${u.created_at.slice(0,10)}</td>
          <td>
            ${u.id !== currentUser?.id
              ? `<button class="btn btn-danger" style="font-size:12px;padding:5px 12px"
                         onclick="deleteUser(${u.id},'${esc(u.username)}')">
                   Löschen
                 </button>`
              : '<span style="font-size:12px;color:var(--text-muted)">(Du)</span>'}
          </td>
        </tr>`).join("");
    } catch(e) {
      tbody.innerHTML = `<tr><td colspan="5" style="color:var(--red);padding:16px">Fehler: ${e.message}</td></tr>`;
    }
  }

  /** Zeigt/versteckt das "Neuer Benutzer"-Formular. */
  function toggleNewUserForm() {
    const form = document.getElementById("newUserForm");
    form.classList.toggle("active");
    document.getElementById("userFormError").style.display = "none";
  }

  /** Legt einen neuen Benutzer an und aktualisiert die Tabelle. */
  async function createUser() {
    const errEl = document.getElementById("userFormError");
    errEl.style.display = "none";

    const body = {
      username:     document.getElementById("newUsername").value.trim(),
      password:     document.getElementById("newPassword").value,
      role:         document.getElementById("newRole").value,
      display_name: document.getElementById("newDisplayName").value.trim()
    };

    if (!body.username || !body.password) {
      errEl.textContent   = "Benutzername und Passwort sind erforderlich.";
      errEl.style.display = "block";
      return;
    }

    try {
      const res  = await authFetch(`${API}/api/users`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) {
        errEl.textContent   = data.error || "Fehler beim Anlegen";
        errEl.style.display = "block";
        return;
      }
      // Formular zurücksetzen und Tabelle neu laden
      document.getElementById("newUsername").value     = "";
      document.getElementById("newPassword").value     = "";
      document.getElementById("newDisplayName").value  = "";
      document.getElementById("newUserForm").classList.remove("active");
      loadUsers();
    } catch(e) {
      errEl.textContent   = "Verbindungsfehler";
      errEl.style.display = "block";
    }
  }

  /**
   * Benutzer löschen (nach Bestätigung).
   * Entfernt die Zeile aus der Tabelle ohne Seite neu zu laden.
   */
  async function deleteUser(id, username) {
    if (!confirm(`Benutzer "${username}" wirklich löschen?\n\nDie Fotos bleiben erhalten.`))
      return;

    try {
      const res = await authFetch(`${API}/api/users/${id}`, { method: "DELETE" });
      if (res.ok) {
        document.getElementById(`user-row-${id}`)?.remove();
      } else {
        const err = await res.json();
        alert(err.error || "Löschen fehlgeschlagen");
      }
    } catch(e) {
      alert("Verbindungsfehler");
    }
  }
</script>
